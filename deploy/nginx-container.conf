# Nginx config inside the app container. The host-level Nginx (with SSL)
# proxies to 127.0.0.1:3000, which lands here.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed build assets
    location ~* ^/(assets|_build)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Static files first; fall back to index.html for client routes
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}