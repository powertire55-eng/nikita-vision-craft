# /etc/nginx/sites-available/ziminikita.ru
# После certbot этот файл будет автоматически дополнен SSL-блоком.

server {
    listen 80;
    listen [::]:80;
    server_name ziminikita.ru www.ziminikita.ru;

    # Для Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # На старте (до certbot) отдаём напрямую; после — certbot добавит редирект на 443.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        client_max_body_size 20M;
    }

    # Долгий кеш для статики TanStack (/_build/, /assets/)
    location ~* ^/(assets|_build)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 302 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}